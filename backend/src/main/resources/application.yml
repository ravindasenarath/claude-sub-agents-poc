spring:
  application:
    name: property-listing-platform

  # PostgreSQL connection pool (ADR-0001: PostgreSQL is the primary datastore).
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:plp}
    username: ${DB_USERNAME:plp}
    password: ${DB_PASSWORD:plp}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: plp-hikari-pool
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      # Kept (not a leftover): -1 makes the Hikari pool bean initialize
      # lazily instead of eagerly probing a connection at context startup.
      # With flyway.enabled: true below (the normal/default profile),
      # Flyway itself still requires a reachable database on startup, so
      # this alone no longer lets a *real* run start without Postgres -
      # that part of the original B0.1 rationale is gone now a schema
      # exists. It is kept because the `test` profile
      # (application-test.yml) sets flyway.enabled: false so the
      # context-load smoke test (PlatformApplicationTests) can assert the
      # module wiring/actuator endpoint without a live database; without
      # this setting, Hikari's own default eager connection probe would
      # fail that test's context startup instead.
      initialization-fail-timeout: -1

  # Flyway: forward-only SQL migrations under
  # src/main/resources/db/migration (see backend/README.md for the naming
  # convention). Explicit `enabled: true` here documents intent even though
  # it is Spring Boot's default whenever flyway-core is on the classpath;
  # the `test` profile (application-test.yml) turns this back off so the
  # context-load smoke test keeps not requiring a live database.
  flyway:
    enabled: true
    locations: classpath:db/migration

# Agent authentication (ADR-0002, B0.2b): JWKS-driven JWT verification.
# The concrete identity provider is still undecided, so these stay plain
# env-var overrides (same convention as the DB_* datasource vars above)
# rather than a vendor-specific default. Local dev / CI use a mock issuer
# instead of a live vendor - see backend/README.md "Auth: local dev / CI"
# and backend/docker-compose.yml.
auth:
  issuer-uri: ${AUTH_ISSUER_URI:http://localhost:8081/default}
  audience: ${AUTH_AUDIENCE:plp-agent-api}
  jwk-set-uri: ${AUTH_JWK_SET_URI:http://localhost:8081/default/jwks}
  # Access tokens are assumed short-lived (~15 min, ADR-0002); this only
  # covers clock drift between this service and the issuer, not
  # long-lived-token handling (that's the frontend BFF's refresh job).
  clock-skew-seconds: ${AUTH_CLOCK_SKEW_SECONDS:60}

# CORS for public-api only (module-boundaries.md: agent-api gets none at
# all - see agentapi.SecurityConfig). Defaults to the Next.js dev server.
public-api:
  cors:
    allowed-origin: ${PUBLIC_WEB_ORIGIN:http://localhost:3000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    defaults:
      enabled: true

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    root: INFO
    com.plp.platform: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n"
